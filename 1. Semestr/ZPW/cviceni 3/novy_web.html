<script>
    document.write("Hallo! <br>");
    for (let i = 1; i < 10; i++) {
        for (let j = 1; j < i; j++) {
            document.write("***");
        }
        document.write("<br>");
    }

    function plocha() {
        let a = parseFloat(document.getElementById("a").value);
        let b = parseFloat(document.getElementById("b").value);
        let c = parseFloat(document.getElementById("c").value);

        let s = (a + b + c) / 2;
        let vysledek = Math.sqrt(s * (s - a) * (s - b) * (s - c));

        document.getElementById("vysl").innerHTML = vysledek;
    }
</script>

<input type="text" id="a"> a <br>
<input type="text" id="b"> b <br>
<input type="text" id="c"> c <br>
<input type="button" value="Spočítat" onclick="plocha()">

<h2 id="vysl">.</h2>
